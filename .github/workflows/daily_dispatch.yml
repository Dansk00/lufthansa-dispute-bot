name: Daily Lufthansa Dispute Submission

on:
  schedule:
    # Rodar todos os dias às 12:00 UTC (09:00 Horário de Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  dispatch-lufthansa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências & Chromium
        run: |
          pip install -r lufthansa_bot/requirements.txt
          python -m patchright install --with-deps chromium

      - name: Configurar e Ativar Cloudflare WARP (Mascara IP de Datacenter)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos connect || true
          sleep 3
          echo "=== Verificando Rota de Saída ==="
          curl -s https://cloudflare.com/cdn-cgi/trace || true
          curl -s https://ipinfo.io || true

      - name: Executar Robô de Envio
        env:
          HEADLESS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python lufthansa_bot/main.py run --headless

      - name: Salvar Comprovantes de Evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lufthansa-receipt-screenshots
          path: lufthansa_bot/data/evidence/*.png
          retention-days: 60
