app = "lufthansa-dispute-bot"
primary_region = "gru" # São Paulo region for lowest latency

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HEADLESS = "true"
  ENABLE_SCHEDULER = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
